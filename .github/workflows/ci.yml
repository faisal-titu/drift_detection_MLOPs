name: CI Pipeline

on:
  push:
    branches: [main, RnD]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      
      - name: Train initial model
        run: python -m training.train
      
      - name: Promote model to production
        run: python -m registry.promote_model
      
      - name: Run tests
        run: pytest tests/ -v --tb=short
      
      - name: Run drift check (no drift)
        run: python -m drift.drift_check --no-drift

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build API image
        run: docker build --network host -f docker/Dockerfile.api -t mlops-api .
      
      - name: Build Dashboard image
        run: docker build --network host -f docker/Dockerfile.dashboard -t mlops-dashboard .
